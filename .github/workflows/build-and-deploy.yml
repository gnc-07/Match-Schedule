# Rebuilds the fixture data, researches missing kick-off times (if an Anthropic API key is set),
# saves any changes to the repository, and publishes the website.
name: Build and deploy site

on:
  schedule:
    - cron: "17 */6 * * *"      # rebuild: minute 17 of every 6th hour, UTC (4 runs a day)
    - cron: "5 12 * * *"        # research + rebuild: 12:05 UTC daily (6:05 a.m. MDT / 5:05 a.m. MST)
  workflow_dispatch:             # adds a "Run workflow" button in the Actions tab
    inputs:
      research:
        description: "Also research missing kick-off times (uses the API key)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["friendlies.json", "overrides.json", "build_schedule.py", "cazetv.py", "research.py", "common.py", "index.html", "fonts/**", "tests/test_scripts.py", ".github/workflows/**"]

permissions: {}                  # nothing by default; each job below asks only for what it needs

concurrency:                     # never run two builds at once; a new one waits for the last
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20            # a stuck download must not keep the machine busy for hours
    permissions:
      contents: write              # lets the job commit the rebuilt data
      pages: write                 # lets configure-pages read the site's Pages settings
    env:
      HAS_RESEARCH_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the newest commit on the branch, not the one that started this run: a run that waited
          # behind another one would otherwise rebuild on old data and clash with its saved changes
          ref: ${{ github.ref_name }}
          # do not leave the push key in the checkout while outside code (the anthropic package, the feeds)
          # runs; the "Save changes" step below hands it to git only for its own commit and push
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the build scripts
        # quick checks with made-up data (no network); a failure stops the run before anything is published
        run: python -m unittest discover -s tests

      - name: Research missing kick-off times
        # only on the daily 12:05 run, or a manual run with the box ticked, and only if the key exists
        if: env.HAS_RESEARCH_KEY == 'true' && (github.event.schedule == '5 12 * * *' || inputs.research)
        continue-on-error: true      # a research problem must never stop the site from updating
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCH_MAX_CALLS: ${{ vars.RESEARCH_MAX_CALLS || '4' }}
        run: |
          pip install --quiet anthropic==1.8.0    # a fixed version: a new release is only used once someone updates this line
          python research.py

      - name: Build fixtures.json and soccer.ics
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}   # optional; empty means openfootball is used
        run: python build_schedule.py

      - name: Save changes to the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # git gets the push key only for each pull and push, as a one-off setting on its command line (the way
          # actions/checkout does it), so the key is never written to .git/config for later steps to read
          auth() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" "$@"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -N soccer.ics fixtures.json streams.json    # lets git diff see the files even on the very first run
          # DTSTAMP and "generated" change on every run, so ignore them when deciding whether anything real changed
          if git diff --quiet -I '^DTSTAMP:' -I '"generated"' -- soccer.ics fixtures.json streams.json friendlies.json overrides.json; then
            echo "No fixture changes."
            # GitHub pauses scheduled workflows after 60 days without repository activity;
            # an empty commit every 45 quiet days keeps the schedule running
            if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
              git commit --allow-empty -m "Keep scheduled runs active"
              auth pull --rebase && auth push
            fi
          else
            git add soccer.ics fixtures.json streams.json friendlies.json overrides.json
            git commit -m "Update fixtures $(date -u +%Y-%m-%dT%H:%MZ)"
            auth pull --rebase && auth push    # pull first in case you edited a file on GitHub meanwhile
          fi

      - name: Collect the files that make up the website
        run: |
          mkdir -p _site
          cp -r index.html fixtures.json soccer.ics fonts _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write                 # lets the job publish to GitHub Pages
      id-token: write              # proves to Pages that this workflow is allowed to deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
